[project]
name = "coding-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abdul Rehman", email = "m.abdulrehman.shoukat@gmial.com" }
]
requires-python = ">=3.11"
dependencies = [
    "docker>=7.2.0",
    "flask>=3.1.3",
    "langchain>=1.3.14",
    "langchain-core>=1.5.3",
    "langchain-ollama>=1.1.0",
    "pydantic-settings>=2.14.2",
]

[project.scripts]
coding-agent = "coding_agent.main:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"
